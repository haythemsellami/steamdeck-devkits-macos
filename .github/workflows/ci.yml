name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One active run per ref; superseded runs are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: lint + typecheck + tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked

      # Hardware tests are excluded automatically: tests/hardware/ self-skips
      # unless DEVKIT_TEST_DEVICE is set, and CI never sets it.
      - name: Run quality gates
        run: scripts/run-gates.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14
