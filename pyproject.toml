[project]
name = "steamos-devkit-mac"
dynamic = ["version"]
description = "Open-source SteamOS Devkit client for macOS: CLI, MCP server, and shared core"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
dependencies = [
    "appdirs>=1.4.4",
    "paramiko>=3.4",
    "pydantic>=2.7",
    "typer>=0.12",
    "ulid-py>=1.1",
    "zeroconf>=0.131",
]

[project.scripts]
devkit = "steamos_devkit.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-mock>=3.14",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/steamos_devkit/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/steamos_devkit"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["src/steamos_devkit/_vendor"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["steamos_devkit"]

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["steamos_devkit._vendor.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["appdirs"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: requires a real device via DEVKIT_TEST_DEVICE (skipped otherwise)",
]

[tool.coverage.run]
source = ["steamos_devkit"]
omit = ["*/_vendor/*"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
